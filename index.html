{% layout none %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Reasons Dog Owners Are Switching to Anti-Bacterial Finger Wipes — VetPets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {{ content_for_header }}

  <style>
    #shopify-section-header,
    .shopify-section-header,
    header,
    .site-header,
    .header,
    .announcement-bar,
    #announcement-bar,
    .shopify-section-announcement-bar,
    .utility-bar,
    .footer,
    footer {
      display: none !important;
    }

    main,
    #MainContent,
    .page-width,
    .container,
    .content-for-layout {
      max-width: none !important;
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    :root {
      --brand-blue: #47B5E9;
      --brand-teal: #13B6B5;
      --brand-teal-dark: #0096B7;
      --brand-light-blue: #D5F7FF;
      --brand-navy: #0D1B2A;
      --brand-red: #E74C3C;
      --brand-yellow: #F4A300;
      --bg-white: #FFFFFF;
      --bg-soft: #F0FBFF;
      --text-dark: #111827;
      --text-mid: #374151;
      --text-light: #6B7280;
      --border: #D1E9F0;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --font-sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      color: var(--text-dark);
      background: var(--bg-white);
      line-height: 1.6;
      font-size: 16px;
      margin: 0 !important;
      padding: 0 !important;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar-guarantee {
      background: var(--brand-teal);
      color: #ffffff;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 10px 12px;
    }

    .topbar-sale {
      background: var(--brand-navy);
      color: #ffffff;
      text-align: center;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .topbar-sale .sale-label {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .topbar-sale .deal-text {
      font-size: 13px;
      opacity: 0.9;
    }

    .countdown {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 5px 10px;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-num {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .countdown-label {
      font-size: 9px;
      letter-spacing: 0.08em;
      opacity: 0.7;
    }

    .countdown-sep {
      font-size: 20px;
      font-weight: 800;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .article-header,
    .comparison-section,
    .reasons-section,
    .reviews-inner,
    .faq-section {
      max-width: 1100px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    .article-header {
      padding-top: 42px;
      padding-bottom: 24px;
    }

    .article-header h1 {
      max-width: 960px;
      font-size: clamp(30px, 4.5vw, 48px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .author-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--brand-blue);
      flex-shrink: 0;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-name {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .verified-badge {
      background: #E8F5E9;
      color: #2D9B4E;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid #A5D6A7;
    }

    .author-date {
      font-size: 12px;
      color: var(--text-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hook-quote {
      max-width: 980px;
      background: #FFF3F3;
      border-left: 4px solid #E63946;
      padding: 18px 20px;
      font-size: 17px;
      font-style: italic;
      font-weight: 700;
      color: var(--text-dark);
      border-radius: 0 8px 8px 0;
    }

    .hook-quote p + p { margin-top: 10px; }

    .trust-bar {
      background: var(--brand-light-blue);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }

    .trust-bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      align-items: center;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .trust-icon,
    .icon-check,
    .icon-cross,
    .icon-neutral,
    .check-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      line-height: 1;
      font-weight: 800;
    }

    .trust-icon {
      width: 38px;
      height: 38px;
      background: var(--brand-teal);
      color: #fff;
      font-size: 22px;
    }

    .comparison-section { margin-top: 28px; }

    .comparison-table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    .comparison-table th {
      padding: 18px 20px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      border-bottom: 2px solid var(--border);
    }

    .comparison-table th.col-product {
      background: linear-gradient(135deg, var(--brand-teal) 0%, var(--brand-blue) 100%);
      color: #fff;
      border-radius: 10px 10px 0 0;
      font-size: 18px;
    }

    .comparison-table th.col-competitor {
      color: var(--text-mid);
      background: #F5F5F5;
    }

    .table-logo {
      max-width: 110px;
      height: auto;
      display: block;
      margin: 0 auto 6px;
      filter: brightness(0) invert(1);
    }

    .comparison-table td {
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .comparison-table td.row-label {
      text-align: left;
      font-weight: 700;
      color: var(--text-dark);
      padding-left: 0;
      white-space: nowrap;
    }

    .row-label-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .comparison-table td.col-product {
      background: #E8F9FD;
      font-weight: 700;
      color: var(--brand-navy);
    }

    .icon-check,
    .icon-cross,
    .icon-neutral {
      width: 24px;
      height: 24px;
      font-size: 13px;
      margin-right: 8px;
    }

    .icon-check { background: var(--brand-teal); color: #fff; }
    .icon-cross { background: var(--brand-red); color: #fff; }
    .icon-neutral { background: #EEF2F3; color: #9CA3AF; }

    .row-label .icon-check {
      width: 16px;
      height: 16px;
      font-size: 10px;
    }

    .tldr-line {
      margin-top: 16px;
      font-size: 15px;
      color: var(--text-mid);
      font-style: italic;
    }

    .tldr-line strong { color: var(--text-dark); }

    .reasons-section { margin-top: 56px; }

    .reason-item {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 44px;
      margin-bottom: 68px;
      align-items: center;
    }

    .reason-image-slot {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-soft);
      box-shadow: var(--shadow);
    }

    .reason-image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      position: static;
      display: block;
    }

    .reason-number {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-teal-dark);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .reason-headline {
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #111111;
      margin-bottom: 16px;
    }

    .reason-body {
      font-size: 16px;
      line-height: 1.72;
      color: var(--text-mid);
    }

    .reason-body p + p { margin-top: 12px; }

    .mid-offer-section {
      background: #D5F7FF;
      padding: 60px 0;
      margin: 8px 0 68px;
    }

    .mid-offer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .mid-offer-card {
      background: rgba(255,255,255,0.25);
      border: 2px solid #47B5E9;
      border-radius: 20px;
      padding: 40px;
    }

    .mid-offer-badge {
      text-align: center;
      color: #DE1313;
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .mid-offer-countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mid-offer-countdown div {
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
    }

    .mid-offer-countdown span {
      font-weight: 800;
      font-size: 14px;
      display: block;
      color: #DE1313;
    }

    .mid-offer-countdown small {
      font-size: 10px;
      color: #666;
    }

    .mid-offer-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .mid-offer-list {
      list-style: none;
      padding: 0;
      margin-bottom: 24px;
    }

    .mid-offer-list li {
      margin-bottom: 10px;
      font-size: 15px;
    }

    .mid-offer-btn {
      display: block;
      background: #3EA0C6;
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .mid-offer-meta {
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .mid-offer-guarantee {
      text-align: center;
      font-size: 12px;
    }

    .mid-offer-image img {
      width: 100%;
      border-radius: 10px;
    }

    .offer-block {
      background: #0D1B2A;
      color: #fff;
      padding: 56px 20px 48px;
      margin: 56px 0 0;
      text-align: center;
    }

    .offer-block .offer-eyebrow {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00B4D8;
      margin-bottom: 10px;
    }

    .offer-block h2 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 12px;
      color: #fff;
    }

    .offer-block h2 span {
      color: #00B4D8;
    }

    .offer-block .offer-sub {
      font-size: 16px;
      opacity: 0.85;
      max-width: 620px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .offer-badges {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .offer-badge {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-cta {
      display: inline-block;
      background: var(--brand-navy);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 16px 42px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }

    .offer-block .btn-cta {
      background: #00B4D8;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 16px 42px;
      border-radius: 50px;
    }

    .stock-note {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.9;
    }

    .offer-block .stock-note {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.8;
    }

    .offer-block .stock-note strong {
      color: #F4A300;
    }

    .check-icon {
      width: 18px;
      height: 18px;
      background: #13B6B5;
      color: #fff;
      font-size: 11px;
    }
        .reviews-section {
      background: #ffffff;
      width: 100%;
      padding: 56px 20px;
    }

    .section-heading {
      font-size: clamp(26px, 3.5vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .section-sub {
      text-align: center;
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 30px;
    }

    .rating-summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .rating-stars { font-size: 24px; color: var(--brand-yellow); letter-spacing: 2px; }
    .rating-score { font-size: 28px; font-weight: 900; }
    .rating-count { font-size: 14px; color: var(--text-light); }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 22px;
    }

    .review-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      min-height: 275px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .review-stars { color: var(--brand-yellow); font-size: 15px; margin-bottom: 8px; }
    .review-title { font-weight: 800; font-size: 16px; margin-bottom: 8px; color: var(--text-dark); }
    .review-body { font-size: 14px; color: var(--text-mid); line-height: 1.6; margin-bottom: 12px; }

    .review-author {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .review-verified {
      background: #E8F5E9;
      color: #2D9B4E;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
    }

    .faq-section {
      max-width: 760px;
      padding-bottom: 58px;
    }

    .faq-item { border-bottom: 1px solid var(--border); }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 18px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-family: var(--font-sans);
    }

    .faq-chevron {
      font-size: 18px;
      transition: transform 0.25s;
      flex-shrink: 0;
      color: var(--brand-teal);
    }

    .faq-question.open .faq-chevron { transform: rotate(180deg); }

    .faq-answer {
      display: none;
      padding: 0 0 18px;
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.7;
    }

    .faq-answer.open { display: block; }

    .final-cta {
      background: var(--bg-soft);
      border-top: 3px solid var(--brand-teal);
      padding: 58px 20px 72px;
      text-align: center;
    }

    .final-cta .eyebrow {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--brand-teal-dark);
      margin-bottom: 10px;
    }

    .final-cta h2 {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .final-cta p {
      font-size: 16px;
      color: var(--text-mid);
      max-width: 620px;
      margin: 0 auto 28px;
      line-height: 1.65;
    }

    .final-cta .btn-cta {
      background: linear-gradient(135deg, var(--brand-teal) 0%, var(--brand-blue) 100%);
    }

    .guarantee-strip {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px 28px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .guarantee-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-mid);
      line-height: 1.25;
    }

    .final-cta .check-icon {
      background: var(--brand-teal);
      color: #fff;
    }

    .sticky-cta {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--brand-navy);
      border-top: 2px solid var(--brand-teal);
      padding: 10px 16px;
      z-index: 999;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }

    .sticky-cta-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .sticky-cta-text { color: #fff; font-size: 13px; }

    .sticky-cta .btn-cta {
      font-size: 14px;
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--brand-teal) 0%, var(--brand-blue) 100%);
      white-space: nowrap;
    }

    .footer-custom {
      background: var(--brand-navy);
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 22px 20px;
      font-size: 12px;
    }

    .footer-custom a {
      color: rgba(255,255,255,0.6);
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .reviews-grid {
        grid-template-columns: 1fr;
      }
      .sticky-cta { display: block; }
      body { padding-bottom: 76px !important; }
    }
  </style>
</head>

<body>
